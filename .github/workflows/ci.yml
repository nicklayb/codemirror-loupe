name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:parser
      - name: Test against the pinned Loupe version
        run: npm run loupe:fetch && npm test
      - name: Test against Loupe main
        if: github.event_name == 'schedule'
        run: LOUPE_REF=main npm run loupe:fetch && npm test
